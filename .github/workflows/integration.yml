name: Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
            tool: just, fd-find, stylua, taplo

      - name: Run checks
        run: just check

      - name: Download data
        run: just download

      - name: Build
        run: just build
