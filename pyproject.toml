[project]
name = "Celeste-OpenWorld-AP-Tracker-generator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.1.1",
]

[dependency-groups]
dev = [
    "clang-format>=22.1.0",
    "mypy>=1.19.1",
    "pack-checker>=1.5.0",
    "ruff>=0.15.1",
    "rumdl>=0.1.21",
]

[tool.ruff]
lint.select = ["ALL"]
lint.ignore = [
    "COM", # Conflicts with formatter
    "FIX", # TODOs intentionally left in code as documentation
]
lint.pydocstyle.convention = "pep257"

[tool.mypy]
strict = true

[tool.rumdl.MD013]
line-length = 120
